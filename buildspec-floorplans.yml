version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - yum install -y jq
      - npm ci

  pre_build:
    commands:
      - |
        set -e

        if [ ! -f build-floorplanconfig.json ]; then
          echo "ERROR: build-floorplanconfig.json not found"
          exit 1
        fi

        # ---------- Read config ----------
        BUILD_SCOPE=$(jq -r '.build_scope // "all"' build-floorplanconfig.json)
        SITE_ID=$(jq -r '.site_id // empty' build-floorplanconfig.json)
        FORCE=$(jq -r '.force // false' build-floorplanconfig.json)
        CONCURRENCY=$(jq -r '.concurrency // 2' build-floorplanconfig.json)
        S3_BUCKET=$(jq -r '.s3_bucket // empty' build-floorplanconfig.json)
        CLOUDFRONT_DIST_ID=$(jq -r '.cloudfront_dist_id // empty' build-floorplanconfig.json)

        # ---------- Validation ----------
        if [ "$BUILD_SCOPE" = "single" ] && [ -z "$SITE_ID" ]; then
          echo "ERROR: site_id is required when build_scope=single"
          exit 1
        fi

        # ---------- Export for build phase ----------
        export BUILD_SCOPE SITE_ID FORCE CONCURRENCY S3_BUCKET CLOUDFRONT_DIST_ID

        echo "Resolved build config:"
        echo "BUILD_SCOPE=$BUILD_SCOPE"
        echo "SITE_ID=$SITE_ID"
        echo "FORCE=$FORCE"
        echo "CONCURRENCY=$CONCURRENCY"
        echo "S3_BUCKET=$S3_BUCKET"
        echo "CLOUDFRONT_DIST_ID=$CLOUDFRONT_DIST_ID"

  build:
    commands:
      - |
        set -e

        if [ "$BUILD_SCOPE" = "single" ]; then
          echo "▶ Building floorplans for site: $SITE_ID"

          if [ "$FORCE" = "true" ]; then
            npm run build:floorplans "$SITE_ID" -- --force
          else
            npm run build:floorplans "$SITE_ID"
          fi

        else
          echo "▶ Building floorplans for ALL sites"

          if [ "$FORCE" = "true" ]; then
            npm run build:floorplans:all -- --concurrency "$CONCURRENCY" --force
          else
            npm run build:floorplans:all -- --concurrency "$CONCURRENCY"
          fi
        fi
        
  post_build:
  commands:
    - echo "▶ Syncing floorplan output to S3"

    - |
      set -e

      if [ "$BUILD_SCOPE" = "single" ] && [ -n "$SITE_ID" ]; then
        echo "▶ Syncing floorplans for site: $SITE_ID"

        if [ ! -d "dist/$SITE_ID/floorplans" ]; then
          echo "⚠️ No floorplans found for $SITE_ID — skipping S3 sync"
          exit 0
        fi

        aws s3 sync \
          "dist/$SITE_ID/floorplans/" \
          "s3://$S3_BUCKET/$SITE_ID/floorplans/" \
          --delete

      else
        echo "▶ Syncing floorplans for ALL changed sites"

        for SITE_DIR in dist/*; do
          if [ -d "$SITE_DIR/floorplans" ]; then
            SITE_NAME=$(basename "$SITE_DIR")

            echo "▶ Syncing floorplans for site: $SITE_NAME"

            aws s3 sync \
              "$SITE_DIR/floorplans/" \
              "s3://$S3_BUCKET/$SITE_NAME/floorplans/" \
              --delete
          fi
        done
      fi


      - echo "▶ Invalidating CloudFront"
      - |
        if [ "$BUILD_SCOPE" = "single" ] && [ -n "$SITE_ID" ]; then
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DIST_ID \
            --paths "/$SITE_ID/*"
        else
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DIST_ID \
            --paths "/*"
        fi      
